<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1626" />
    <meta
      name="description"
      content="Portfolio of Alabi Tosin Samson (primeswitch), web and software developer."
    />
    <title>primeswitch | Alabi Tosin Samson</title>
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Link preview (WhatsApp, LinkedIn, X, Slack...).
         TODO: if your domain is not primeswitch.com, change it in the two URLs below.
         These tags are read from this file only, so they are the same for every page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="primeswitch" />
    <meta property="og:title" content="primeswitch | Alabi Tosin Samson" />
    <meta
      property="og:description"
      content="Web and software developer building fast, accessible websites and apps with React, WordPress and Node.js."
    />
    <meta property="og:url" content="https://primeswitch.com/" />
    <meta property="og:image" content="https://primeswitch.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="primeswitch logo with the name Alabi Tosin Samson, Web and Software Developer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="primeswitch | Alabi Tosin Samson" />
    <meta
      name="twitter:description"
      content="Web and software developer building fast, accessible websites and apps with React, WordPress and Node.js."
    />
    <meta name="twitter:image" content="https://primeswitch.com/og-image.png" />

    <!-- Sets the saved theme before the page paints, so there is no dark/light flash -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>

    <!-- Fonts: preconnect first so the browser opens the connections early -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
